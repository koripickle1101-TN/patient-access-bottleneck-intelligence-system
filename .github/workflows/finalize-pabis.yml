name: Finalize and verify PABIS workbook
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/finalize_pabis.py
      - .github/workflows/finalize-pabis.yml
permissions:
  contents: write
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply correction and verify workbook
        run: python scripts/finalize_pabis.py
      - name: Publish verified workbook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Patient_Access_Bottleneck_Intelligence_System.xlsx
          git commit -m "Finalize PABIS workbook: 50 formulas, 3 dropdowns and closure controls"
          git push
